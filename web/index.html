<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizon browser startup test</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font: 16px system-ui, sans-serif;
    }

    #status {
      padding: 16px;
      white-space: pre-wrap;
    }

    canvas {
      display: block;
      width: min(100%, 1280px);
      height: auto;
      margin: 0 auto;
      background: #202838;
    }
  </style>
</head>
<body>
  <div id="status">Loading Horizon WASM…</div>
  <canvas id="horizon-canvas"></canvas>

<script type="module">
  const status = document.getElementById("status");

  window.addEventListener("error", (event) => {
    status.textContent += `\nBrowser error: ${event.message}`;
  });

  window.addEventListener("unhandledrejection", (event) => {
    console.error(event.reason);
    status.textContent += `\nAsync error: ${String(event.reason)}`;
  });

  try {
    const horizon = await import("./pkg/horizon_client.js");
    await horizon.default();

    status.textContent = "Calling Horizon game::run()...";
    console.log("Horizon: entering game::run()");

    horizon.run_full_game();

    status.textContent += "\ngame::run() returned Ok(()).";
    console.log("Horizon: game::run() returned Ok(())");
  } catch (error) {
    console.error("Horizon full startup failed:", error);
    status.textContent += `\nStartup failed: ${String(error)}`;
  }
</script>
</body>
</html>
