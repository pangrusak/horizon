<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizon browser startup test</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font: 16px system-ui, sans-serif;
    }

    #status {
      padding: 16px;
      white-space: pre-wrap;
    }

    canvas {
      display: block;
      width: min(100%, 1280px);
      height: auto;
      margin: 0 auto;
      background: #202838;
    }
  </style>
</head>
<body>
  <div id="status">Loading Horizon WASM…</div>
  <canvas id="horizon-canvas"></canvas>

  <script type="module">
    const status = document.getElementById("status");

    try {
      const { default: init } = await import("./pkg/horizon_client.js");
      await init();

      status.textContent += "\nChecking WebGPU…";

      if (!navigator.gpu) {
        throw new Error(
          "WebGPU is unavailable. Check browser support and hardware acceleration."
        );
      }

      const adapter = await navigator.gpu.requestAdapter({
        powerPreference: "high-performance",
      });

      if (!adapter) {
        throw new Error("WebGPU could not find a usable GPU adapter.");
      }

      const device = await adapter.requestDevice();

      const report = {
        adapter: adapter.info?.description || "Description unavailable",
        maxTextureDimension2D: device.limits.maxTextureDimension2D,
        maxTextureArrayLayers: device.limits.maxTextureArrayLayers,
        maxBindGroups: device.limits.maxBindGroups,
        maxStorageBuffersPerShaderStage:
          device.limits.maxStorageBuffersPerShaderStage,
      };

      console.table(report);
      status.textContent +=
        "\nWebGPU device created successfully.\n" +
        JSON.stringify(report, null, 2) +
        "\nHorizon renderer not started.";

      device.destroy();
    } catch (error) {
      console.error(error);
      status.textContent += `\nStartup check failed: ${error.message ?? error}`;
    }
  </script>
</body>
</html>
